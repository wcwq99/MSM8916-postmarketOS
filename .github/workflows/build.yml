name: Build postmarketOS multi-board image

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PMB_WORK: /home/runner/pmbootstrap-work
  PMB_APORTS: /home/runner/pmaports
  PMB_EXPORT: /tmp/postmarketOS-export
  PMBOOTSTRAP_REV: b2bf3539cd92acce4ab187167581168e845f3e7e
  PMAPORTS_REV: 1ce58c5ae1b7573c6471959c4ab406391eefb103

jobs:
  build:
    runs-on: ubuntu-24.04
    # Stay below the 6h hard limit so a hang fails the job while the failure
    # diagnostics steps can still run.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binfmt-support \
            bison \
            btrfs-progs \
            build-essential \
            device-tree-compiler \
            e2fsprogs \
            flex \
            gcc-arm-none-eabi \
            binutils-aarch64-linux-gnu \
            git \
            kpartx \
            libfdt-dev \
            multipath-tools \
            openssl \
            parted \
            python3 \
            python3-cryptography \
            qemu-user-static \
            rsync \
            shellcheck \
            tar \
            unzip \
            util-linux \
            wget

      - name: Validate scripts and manifests
        run: |
          shellcheck scripts/*.sh
          for script in scripts/*.sh; do bash -n "$script"; done
          test "$(grep -cv '^#' config/boards.conf)" -eq 19
          test "$(grep -c '.dtb$' config/openstick-dtbs.list)" -eq 14

      - name: Ensure loop devices are available
        # ubuntu-24.04 ships /dev/loop* ready to use, but pmbootstrap's losetup
        # has failed before on Namespace runners with "Operation not permitted".
        # Keep this as a defensive check: load the module, materialize any
        # missing minor nodes, and fail loudly if losetup still cannot attach.
        # The attach probe runs under sudo because LOOP_SET_FD needs
        # CAP_SYS_ADMIN; pmbootstrap itself sudo-calls losetup, so a probe that
        # succeeds only under sudo matches the real install path.
        run: |
          sudo modprobe loop 2>/dev/null || true
          for i in $(seq 0 7); do
            [ -b /dev/loop$i ] || sudo mknod -m 660 /dev/loop$i b 7 $i
          done
          losetup -f || true
          echo "loop devices:"; losetup -l
          # Prove losetup can actually attach under sudo, not just that nodes
          # exist. This catches the Namespace-style "node exists but ioctl
          # denied" failure before we burn 30+ minutes on the kernel build.
          t=$(mktemp)
          truncate -s 1M "$t"
          loop=$(sudo losetup -f --show -P "$t") || {
            echo "ERROR: sudo losetup cannot attach a test file."
            echo "This runner is unsuitable for pmbootstrap install."
            rm -f "$t"
            exit 1
          }
          sudo losetup -d "$loop"
          rm -f "$t"

      - name: Clone pinned pmbootstrap and pmaports
        run: |
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          git -C "$HOME/pmbootstrap" checkout "$PMBOOTSTRAP_REV"
          git clone --filter=blob:none https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PMB_APORTS"
          git -C "$PMB_APORTS" checkout "$PMAPORTS_REV"
          mkdir -p "$HOME/.local/bin" "$HOME/.config"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Add the 19-board kernel overlay
        run: scripts/prepare-pmaports.sh "$PMB_APORTS"

      - name: Restore pmbootstrap ccache
        # Cache only the C compiler cache, never chroot_native/ or rootfs
        # chroots (they hold bind mounts and binfmt state that break on
        # restore). ccache is keyed on the pmbootstrap pin + work version,
        # so a dependency bump invalidates cleanly. With a warm cache the
        # 35-55 min kernel build drops to ~5-10 min.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PMB_WORK }}/ccache
            ${{ env.PMB_WORK }}/ccache_aarch64
          key: pmbootstrap-ccache-${{ env.PMBOOTSTRAP_REV }}-${{ env.PMAPORTS_REV }}
          restore-keys: |
            pmbootstrap-ccache-${{ env.PMBOOTSTRAP_REV }}-

      - name: Configure pmbootstrap
        run: |
          mkdir -p "$PMB_WORK"
          PYTHONPATH="$HOME/pmbootstrap" python3 -c \
            'import pmb.config; print(pmb.config.work_version)' > "$PMB_WORK/version"
          cat > "$HOME/.config/pmbootstrap_v3.cfg" <<EOF
          [pmbootstrap]
          aports = $PMB_APORTS
          boot_size = 512
          build_default_device_arch = True
          build_pkgs_on_install = True
          ccache_size = 5G
          device = zhihe-generic
          extra_packages = soc-qcom-msm8916-rproc,qmi-utils,qrtr,modemmanager,iw,wpa_supplicant,wireless-regdb,dnsmasq,iptables,iproute2
          hostname = msm8916-pmos
          is_default_channel = False
          jobs = 4
          kernel = ufi001c
          locale = C.UTF-8
          ssh_keys = False
          sudo_timer = False
          timezone = Asia/Shanghai
          ui = console
          user = user
          work = $PMB_WORK

          [providers]

          [mirrors]
          EOF
          sed -i 's/^          //' "$HOME/.config/pmbootstrap_v3.cfg"
          pmbootstrap --version
          pmbootstrap config device
          pmbootstrap config kernel
          pmbootstrap config ui
          pmbootstrap config extra_packages

      - name: Checksum and build the patched kernel package
        run: |
          pmbootstrap checksum linux-postmarketos-qcom-msm8916
          pmbootstrap build --arch aarch64 --force linux-postmarketos-qcom-msm8916

      - name: Build split postmarketOS image
        run: |
          # Never use "pmbootstrap log" here: it runs "tail -F" and blocks
          # forever, which burned two full 6h CI jobs.
          if ! pmbootstrap install --split --filesystem btrfs --password 147147; then
            echo "==== first crash/panic line in log.txt ===="
            grep -nE '^(panic|fatal error|runtime:|ERROR)' "$PMB_WORK/log.txt" | head -n 20 || true
            echo "==== pmbootstrap log.txt (last 500 lines) ===="
            tail -n 500 "$PMB_WORK/log.txt" || true
            exit 1
          fi

      - name: Switch to CN mirrors and install USB NCM+RNDIS gadget
        # All writes target $ROOTFS, which pmbootstrap created under sudo, so
        # every file there is root-owned. Use sudo tee / sudo install for all
        # writes; plain "cat >" fails with "Permission denied" on the runner
        # user.
        run: |
          ROOTFS="$PMB_WORK/chroot_rootfs_zhihe-generic"
          test -d "$ROOTFS" || { echo "rootfs chroot missing: $ROOTFS"; exit 1; }

          # 1) Replace apk repositories with TUNA mirrors (Alpine edge + pmOS)
          sudo tee "$ROOTFS/etc/apk/repositories" > /dev/null <<'REPOS'
          https://mirrors.tuna.tsinghua.edu.cn/alpine/edge/main
          https://mirrors.tuna.tsinghua.edu.cn/alpine/edge/community
          https://mirrors.tuna.tsinghua.edu.cn/postmarketOS/master
          REPOS
          sudo sed -i 's/^          //' "$ROOTFS/etc/apk/repositories"

          # 2) Networking deps (dnsmasq, iptables, iproute2) are installed via
          #    extra_packages above during pmbootstrap install, so no extra apk
          #    call here that could desync the chroot state.

          # 3) Gadget setup script: builds a composite NCM+RNDIS gadget via configfs.
          #    Pattern verified in kinsamanka/OpenStick-Builder setup_ncm_gadget.sh,
          #    extended here to expose both ncm.1 and rndis.0 functions so the host
          #    can use whichever the OS prefers (Win/macOS -> RNDIS, Linux -> NCM).
          sudo tee "$ROOTFS/usr/local/bin/setup_usb_gadget.sh" > /dev/null <<'GADGET'
          #!/bin/sh -e
          CONFIGFS=/sys/kernel/config/usb_gadget
          NAME=openstick
          DIR=$CONFIGFS/$NAME
          [ -d "$CONFIGFS" ] || { echo "configfs missing"; exit 0; }
          [ -d "$DIR" ] && exit 0
          mkdir -p "$DIR/functions/ncm.1" "$DIR/functions/rndis.0"
          echo 0x0200  > "$DIR/bcdUSB"
          echo 0x1d6b  > "$DIR/idVendor"   # Linux Foundation
          echo 0x0104  > "$DIR/idProduct"  # Multifunction Composite Gadget
          echo 0x40    > "$DIR/bMaxPacketSize0"
          mkdir -p "$DIR/strings/0x409"
          echo "4G LTE Dongle" > "$DIR/strings/0x409/product"
          echo "Openstick"    > "$DIR/strings/0x409/manufacturer"
          echo "0123456789"   > "$DIR/strings/0x409/serialnumber"
          # RNDIS uses a different interface class so Windows auto-binds usbnet/rndis
          echo 0xef > "$DIR/functions/rndis.0/bInterfaceClass"
          mkdir -p "$DIR/configs/c.1"
          echo 0x80 > "$DIR/configs/c.1/bmAttributes"
          echo 250  > "$DIR/configs/c.1/MaxPower"
          ln -sf "$DIR/functions/ncm.1"    "$DIR/configs/c.1"
          ln -sf "$DIR/functions/rndis.0" "$DIR/configs/c.1"
          # OS descriptors so Windows loads RNDIS drivers automatically
          echo "MSFT100" > "$DIR/os_desc/qw_sign"
          echo 0xbc     > "$DIR/os_desc/b_vendor_code"
          echo 1        > "$DIR/os_desc/use"
          ln -sf "$DIR/configs/c.1" "$DIR/os_desc"
          echo "$(ls /sys/class/udc | head -1)" > "$DIR/UDC"
          GADGET
          sudo chmod +x "$ROOTFS/usr/local/bin/setup_usb_gadget.sh"

          # 4) OpenRC service that brings the gadget up and assigns IPv4+IPv6.
          #    Device side: 10.0.0.1/24 + fc00::1/64; host gets .2/fc00::2 via DHCP.
          sudo tee "$ROOTFS/etc/init.d/usb-gadget" > /dev/null <<'SVC'
          #!/sbin/openrc-run
          description="USB NCM+RNDIS gadget networking"
          depend() { after modules localmount; need dev-settle; }
          start() {
            ebegin "Setting up USB gadget"
            modprobe libcomposite 2>/dev/null || true
            /usr/local/bin/setup_usb_gadget.sh
            # Wait for the usb0 interface to appear
            for i in $(seq 1 30); do
              ip link show usb0 >/dev/null 2>&1 && break
              sleep 1
            done
            ip link set usb0 up
            ip addr add 10.0.0.1/24 dev usb0 2>/dev/null || true
            ip -6 addr add fc00::1/64 dev usb0 2>/dev/null || true
            # DHCPv4 + DHCPv6 via dnsmasq on the USB link
            pkill dnsmasq 2>/dev/null || true
            dnsmasq --interface=usb0 --bind-interfaces --no-resolv \
              --dhcp-range=10.0.0.2,10.0.0.6,255.255.255.0,12h \
              --dhcp-range=fc00::2,fc00::6,64,12h \
              --dhcp-option=option:router,10.0.0.1 \
              --dhcp-option=option:dns-server,10.0.0.1,223.5.5.5,2400:3200::1
            eend 0
          }
          stop() { pkill dnsmasq 2>/dev/null || true; eend 0; }
          SVC
          sudo chmod +x "$ROOTFS/etc/init.d/usb-gadget"

          # 5) udev: fire the gadget setup as soon as the UDC appears at boot
          sudo mkdir -p "$ROOTFS/etc/udev/rules.d"
          sudo tee "$ROOTFS/etc/udev/rules.d/10-udc.rules" > /dev/null <<'UDEV'
          ACTION=="add", SUBSYSTEM=="udc", RUN+="/sbin/modprobe libcomposite", RUN+="/usr/local/bin/setup_usb_gadget.sh"
          SUBSYSTEM=="net", ACTION=="add|change|move", ENV{DEVTYPE}=="gadget", ENV{NM_UNMANAGED}="0"
          UDEV

          # 6) Enable service at boot (symlink equivalent of rc-update add) + forwarding
          sudo mkdir -p "$ROOTFS/etc/runlevels/default"
          sudo ln -sf /etc/init.d/usb-gadget "$ROOTFS/etc/runlevels/default/usb-gadget"
          sudo tee -a "$ROOTFS/etc/sysctl.conf" > /dev/null <<'SYSCTL'
          net.ipv4.ip_forward=1
          net.ipv6.conf.all.forwarding=1
          SYSCTL

          # 7) Belt-and-suspenders: flip chroot copy of extlinux to UFI003 too
          if [ -f "$ROOTFS/boot/extlinux/extlinux.conf" ]; then
            sudo sed -i 's#^[[:space:]]*fdt .*#\tfdt /dtbs/qcom/msm8916-thwc-ufi003.dtb#' \
              "$ROOTFS/boot/extlinux/extlinux.conf"
          fi

          # Finally export the prepared image
          pmbootstrap export

      - name: Upload pmbootstrap failure log
        # Not failure(): a job killed by the timeout is "cancelled", and this
        # step was skipped exactly when the log was needed most.
        if: ${{ !success() }}
        uses: actions/upload-artifact@v5
        with:
          name: pmbootstrap-failure-log
          path: ${{ env.PMB_WORK }}/log.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build bootloader artifacts
        run: |
          mkdir -p artifacts/bootloaders
          scripts/build-bootloaders.sh artifacts/bootloaders
          echo '72494b6882f60cc1704f2970543adb91370d1ec75497c4f6510fc13a4e1378ee  temp/dragonboard410c_bootloader_emmc_android-88.zip' \
            | sha256sum -c -
          unzip -o -j -d /tmp/db410c_fw \
            temp/dragonboard410c_bootloader_emmc_android-88.zip 'tz.mbn'
          cp /tmp/db410c_fw/tz.mbn artifacts/bootloaders/tz.mbn

      - name: Configure and verify the multi-board boot image
        run: |
          mkdir -p artifacts/dtbs
          scripts/configure-multiboard-boot.sh \
            "$PMB_EXPORT/zhihe-generic-boot.img" artifacts/dtbs

      - name: Collect and verify release files
        run: |
          mkdir -p artifacts/export
          cp config/boards.conf artifacts/boards.conf
          cp "$HOME/.config/pmbootstrap_v3.cfg" artifacts/pmbootstrap_v3.cfg
          pmbootstrap status > artifacts/pmbootstrap-status.txt || true
          while IFS= read -r path; do
            rel="${path#$PMB_EXPORT/}"
            mkdir -p "artifacts/export/$(dirname "$rel")"
            cp -L "$path" "artifacts/export/$rel"
          done < <(find "$PMB_EXPORT" -xtype f | sort)
          {
            echo "root=$(git rev-parse HEAD)"
            echo "pmos-example=$(git -C pmos-example rev-parse HEAD)"
            echo "debian-dtbs=$(git -C debian-dtbs rev-parse HEAD)"
            echo "pmbootstrap=$PMBOOTSTRAP_REV"
            echo "pmaports=$PMAPORTS_REV"
          } > artifacts/source-versions.txt
          (
            cd artifacts
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          test "$(find artifacts/dtbs -maxdepth 1 -type f -name '*.dtb' | wc -l)" -eq 19
          tar -C artifacts -czf postmarketos-msm8916-multiboard.tar.gz .
          tar -tzf postmarketos-msm8916-multiboard.tar.gz | grep -Fq './export/zhihe-generic-boot.img'
          tar -tzf postmarketos-msm8916-multiboard.tar.gz | grep -Fq './export/zhihe-generic-root.img'

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v5
        with:
          name: postmarketos-msm8916-multiboard
          path: postmarketos-msm8916-multiboard.tar.gz
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: multiboard-${{ github.run_number }}
          name: "postmarketOS MSM8916 multi-board #${{ github.run_number }}"
          body: |
            One split postmarketOS image containing all 19 supported MSM8916 DTBs.

            The default is `msm8916-thwc-ufi001c.dtb`. Mount the boot image and edit
            `/extlinux/extlinux.conf`, or edit `/boot/extlinux/extlinux.conf` after
            installation, to select another file listed in `boards.conf`.

            CI verifies DTB compilation/structure and image contents. Hardware boot
            and peripheral behavior remain board-owner validation tasks.
          files: postmarketos-msm8916-multiboard.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
